# Reusable workflow: tells the website that a moonbase repository changed, so the "Arrivals at the
# moonbase" board on the homepage refreshes within a minute or two. It sends a "moonbase-updated"
# repository_dispatch to lunar-linux/lunar-web, which runs its "Moonbase feed" workflow.
#
# Call it from a moonbase repository (.github/workflows/notify-website.yml):
#
#   on:
#     push:
#       branches: [master]
#   permissions: {}
#   jobs:
#     notify:
#       uses: lunar-linux/.github/.github/workflows/notify-website.yml@v1
#       secrets: inherit
#
# Signs in as the organization's "Lunar website notifier" GitHub App, installed on lunar-web only:
#   - org variable MOONBASE_APP_CLIENT_ID: the App's Client ID (not secret)
#   - org secret MOONBASE_APP_PRIVATE_KEY: the App's private key (.pem)
# Each run gets a token that lasts an hour and can only write lunar-web's contents (which is what
# sending a dispatch requires). Without them this does nothing and the website still refreshes
# within the hour.
name: Notify website

on:
  workflow_call:
    secrets:
      MOONBASE_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ vars.MOONBASE_APP_CLIENT_ID != '' && secrets.MOONBASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Not set up yet
        if: env.CONFIGURED != 'true'
        run: echo "::notice::The website notifier app isn't set up for this repository; the website refreshes within the hour anyway."

      - name: Sign in as the website notifier app
        id: app
        if: env.CONFIGURED == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MOONBASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MOONBASE_APP_PRIVATE_KEY }}
          owner: lunar-linux
          repositories: lunar-web
          permission-contents: write

      - name: Send moonbase-updated to lunar-web
        if: env.CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE: ${{ github.repository }}
        run: |
          gh api repos/lunar-linux/lunar-web/dispatches \
            -f event_type=moonbase-updated \
            -f "client_payload[repository]=$SOURCE"
          echo "Told lunar-web that $SOURCE changed."
